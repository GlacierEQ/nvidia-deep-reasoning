name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-proof:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Python surfaces
        run: python -m compileall -q src tests scripts
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Enforce public truth boundary
        run: python scripts/verify_public_truth.py
